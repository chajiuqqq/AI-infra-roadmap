const stages=[
{n:0,title:'测量先行，建立问题清单',time:'第 1–2 周',milestone:'G0 · 可信基线',owner:'C 主责，A/B 联合',goal:'先回答现在慢在哪里、值得改什么，再确定学习与优化投入。',tasks:['锁定引擎 commit、模型 revision、tokenizer、驱动、CUDA 与依赖，保存启动命令和容器摘要。','以短交互、长上下文、混合到达三类真实负载建立基线，固定长度分布、到达率和随机种子。','分开采集冷启动与稳态：TTFT / TPOT / E2E 的 P50/P95/P99、输出吞吐、失败率、显存与功耗（可用时）。','记录 GPU 拓扑、P2P 可用性与通信基线；完成一条请求的 CPU/GPU trace。','产出按影响、证据和工作量排序的前三个瓶颈；先检查升级和配置是否已能解决。'],gate:'另一位成员可按同一配置复现基线；至少一个瓶颈有时间线证据。定义业务 SLO 和波动区间后再承诺提升幅度。',deliver:'baseline.json + workload.jsonl + trace + 1 页瓶颈决策记录',dependency:'起点；生产性能与质量目标尚未提供，必须由团队在 G0 确认。',reads:['bench','nsight','blackwell','nccl']},
{n:1,title:'执行路径与分层正确性',time:'第 3–6 周',milestone:'G1 · 验证契约',owner:'全员参与，C 维护',goal:'小模型用于完整理解；目标 230B 模型用于层级抽样和真实回归。',tasks:['在一个 1B 以下 Dense 模型上实现 PyTorch 前向，标出 prefill/decode、张量形状、KV 写入与 kernel 调用。','对 RoPE、GQA、RMSNorm 和简化 MoE 路由分别对拍，覆盖 padding、边界位置、不同 shape 与 dtype。','目标模型按单层、单专家或小张量抽样验证 NVFP4 packing、scale、反量化和 GEMM，避免整模型展开为高精度。','采用相同量化权重与反量化契约比较“实现误差”；另以 BF16/FP16 基线比较“量化质量损失”。','增加 teacher-forcing 下的多步 logits 检查、错误定位与业务质量样本；记录不同算子的 atol/rtol 依据。'],gate:'小模型完整前向与选定参考实现对齐；目标模型关键子图通过测试；已把量化质量损失与实现错误分开。top-k 一致只作辅助，不能单独通关。',deliver:'reference/ + operator_tests/ + tolerance.yaml + 执行路径图',dependency:'依赖 G0 环境锁定；基准采集、调度阅读与早期集成可同步继续。',reads:['nano','testing','nvfp4','paged']},
{n:2,title:'一个 Kernel，尽早接入',time:'第 5–10 周',milestone:'G2 · 首个集成闭环',owner:'A 写算子，B 集成，C 交叉验证',goal:'用 RMSNorm 或 RoPE 学完整闭环，并提前检验真实引擎的接口与开销。',tasks:['先实现一个 Triton RMSNorm 或 RoPE，覆盖真实张量尺寸、非连续布局、尾块和极端输入。','对 PyTorch 参考实现和引擎已有优化实现分别测速；预热后用正确同步方式计时，报告中位数与波动。','第 6 周左右开始试接入锁定版本的 CustomOp/扩展点；记录实际 dispatch，验证不是悄悄 fallback。','检查 eager、编译模式、CUDA Graph、多进程加载与回退路径，跑小模型及目标模型 smoke 回归。','为 kernel 记录 roofline/带宽或启动开销解释；如果没有生产收益，保留教学资产并停止继续打磨。'],gate:'一个自写算子通过对拍且在引擎内确实执行，端到端无超出约定波动的退化。教育通关不强制胜过成熟 kernel；生产启用另走质量与收益门槛。',deliver:'一个可安装实验扩展 + 正确性报告 + 微基准与端到端对照',dependency:'实现依赖 G1 的对应算子测试；不必等完整 NVFP4/Decode Attention 自研。',reads:['triton','custom','plugin','nsight']},
{n:3,title:'解决一个真实量化／适配问题',time:'第 3–5 月',milestone:'G3 · 可维护生产增量',owner:'B 主责，A 后端分析，C 发布验证',goal:'围绕当前生产瓶颈做最小改动，选量化后端或硬件适配中的一个方向。',tasks:['按模型 × 量化格式 × GPU 架构 × 引擎/后端版本建立能力矩阵，区分门控、编译、布局与指令缺失。','重测当前版本；将 #33416 作为历史回归案例，选择尚未被上游解决且影响业务的问题。','优先升级、配置和复用 CUTLASS/FlashInfer 路径；必要时才做后端选择、融合、packing 或 kernel 修改。','在目标 230B MoE 上完成固定负载回归与任务质量评估，保留可回滚的原版路径。','沉淀 issue/补丁/测试与上游提案；测两类以上负载并由非作者复现，说明适用与退化边界。'],gate:'交付一个真实可复现的修复或收益：原来不能跑则正确跑通；原来可跑则在质量和 SLO 约束下超过基线波动。上游 PR 接受与否不作为团队准出条件。',deliver:'兼容矩阵 + 最小补丁/插件 + 质量报告 + A/B 结果 + 回滚说明',dependency:'G1 的相关正确性契约和 G2 的集成方法；可从生产卡点提早启动。',reads:['nvfp4','cutlass','flashinfer','issue','eval']},
{n:4,title:'调度、KV 与通信按瓶颈分支',time:'第 5–8 月',milestone:'G4 · SLO 下的系统收益',owner:'B 主责，A/C 联合',goal:'系统层改进从 G0 已开始观察；此阶段深入最有收益的一条分支。',tasks:['用混合请求验证是否存在 prefill/decode 干扰，测 chunked prefill、连续批处理与 CUDA Graph 的收益边界。','如果 KV 是瓶颈，比较分页、前缀缓存与 KV dtype；记录命中率、驱逐/重计算、质量与 OOM。','如果通信是瓶颈，分解 TP/EP 流量与 PCIe/P2P 路径；比较不同并行配置，计入负载不均衡。','仅在干扰和传输收益模型支持时做 PD 分离 PoC，计入 KV 传输、排队、额外卡数与运维成本。','做消融实验、长短请求混合压测与稳定性 soak，输出 quality/SLO 下的 goodput 和每百万合格输出 Token 成本。'],gate:'选定一条分支产生可复现的端到端收益，质量与尾延迟不退化，收益超过噪声区间。给出不适用负载，并能解释为何其余分支暂缓。',deliver:'调优/修改成果 + 消融报告 + 稳定性报告 + 吞吐/延迟/成本曲线',dependency:'G0 的指标与环境、G3 的稳定执行路径。调度调参不被“必须先自研 kernel”阻断。',reads:['paged','mini','bench','nccl','moonpaper','mooncake']},
{n:5,title:'能力固化与迁移演练',time:'第 9–12 月',milestone:'G5 · 两周评估能力',owner:'C 组织，角色轮换交付',goal:'让新硬件、新模型的评估能交给其他成员完成；资产建设贯穿所有阶段。',tasks:['将基准、对拍、版本矩阵、构建与回滚纳入自动回归；每项资产至少有两位能维护的成员。','在设备、驱动、权重和 SDK 已可获取的条件下，选择一个团队未接触的模型或硬件开展盲测。','10 个工作日内输出 supported / unsupported / blocked 判定，给出可运行配置或阻塞原因、证据和解除条件。','能运行时报告正确性、负载范围与性能；不能运行时用最小复现、能力矩阵或官方限制支撑结论。','让非原作者从空环境复现报告；复盘时间消耗与证据缺口，更新接入 checklist 和技术债清单。'],gate:'两周内交付可审计的 go/no-go/blocked 报告，而非承诺任何新卡都能跑。允许引用官方资料和供应商公开 SDK，关键诊断不依赖外部人员代做。',deliver:'评估工具箱 + 接入 SOP + 迁移演练报告 + 维护交接记录',dependency:'前述资产持续积累；全新非 CUDA 生态可能需要另立项目，不能套用两周完成适配。',reads:['blackwell','plugin','bench','eval']}
];

{id:'P4',title:'混合负载调度与 KV 实验',stage:'S4',goal:'把 kernel 数字连接到用户体验与服务成本。',steps:['重放长短请求混合到达，绘制延迟/吞吐与队列变化。','单变量比较 prefill 分块、缓存或并行配置，再做组合实验。','有证据才加入 PD 分离，包含 KV 传输与额外资源成本。'],accept:'同质量、同 SLO 下给出收益与失效边界；不是只比较峰值 tokens/s。',refs:['paged','bench','moonpaper','mooncake']},

const R=id=>resources.find(r=>r.id===id), link=r=>`<a href="${r.url}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`, readings=ids=>`<div class="reading"><h3>参考阅读与项目</h3><ul>${ids.map(id=>{let r=R(id);return `<li>${link(r)}<span>${esc(r.why)}</span></li>`}).join('')}</ul></div>`;
let saved={};try{saved=JSON.parse(localStorage.getItem('inference-roadmap-v1')||'{}')||{}}catch{};saved.tasks=saved.tasks||{};saved.notes=saved.notes||{};let current='roadmap';function save(){try{localStorage.setItem('inference-roadmap-v1',JSON.stringify(saved))}catch{$('#save-status').textContent='浏览器未允许保存，当前勾选仅在本次页面有效。'}}
$('#roadmap').innerHTML=`<div class="searchable"><div class="eyebrow">ROADMAP / 2026.10</div><h1>推理引擎能力建设路线</h1><p class="lead">从会部署，到能定位、能修改、能证明收益。每一阶段都交付可复现资产，围绕真实负载推进。</p><div class="intro"><div><strong>方向保留，路线重新排序。</strong><p>开源增量 + 分层正确性 + 持续 profiling。先建立可信基线，再用最小改动进入引擎，随后按瓶颈深入。</p></div><div class="big">12<small>个月 · 3 人投入假设</small></div></div><div class="stats"><div class="stat"><b>2 周</b><span>基线与瓶颈清单</span></div><div class="stat"><b>6–10 周</b><span>首个算子集成闭环</span></div><div class="stat"><b>6 阶段</b><span>以证据决定准出</span></div></div><div class="panel"><h3>推进顺序</h3><p class="fine">G0 → G1；G1 对应算子的验证 → G2 集成；G3 生产路径稳定 → G4 深度系统优化。profiling、质量回归、文档与交接贯穿全程。周次从项目启动计算。</p><div class="timeline">${stages.map(s=>`<a href="#s${s.n}"><small>${s.time}</small><div class="rail"></div><b>S${s.n} ${s.milestone.split(' · ')[1]}</b></a>`).join('')}</div><div class="notice">按 3 人持续投入、可使用现有目标 GPU/模型、以 vLLM 为主引擎估算。并行窗口不是额外人力；若为兼职，重排范围与日历。阶段一周次与阶段二重叠，有意让集成提早发生。</div><div class="progress-line"><span>学习完成度</span><progress id="global-progress" max="30" value="0"></progress><b id="global-count">0/30</b></div><p id="save-status" class="source-line">进度与笔记保存在当前浏览器。打勾记录学习，正式准出必须附验证证据。</p></div></div>${renderDetailedRoadmap()}${stages.map(s=>`<article class="stage searchable" id="s${s.n}"><div class="stage-head"><span class="stage-number">0${s.n}</span><div><h2>${s.title}</h2><p>${s.time} · ${s.owner}</p></div><span class="badge" id="count-${s.n}">0/${s.tasks.length}</span></div><div class="stage-body"><p>${s.goal}</p>${renderMindmap(s)}${renderLearningGuide(s)}<div class="gate stage-exit"><span class="mini-label">EXIT GATE</span><h3>${s.milestone}</h3><p>${s.gate}</p><span class="mini-label">交付物</span><p>${s.deliver}</p><span class="mini-label">依赖与边界</span><p>${s.dependency}</p></div><details class="reference-details"><summary>做实验时再查：实现、API 与工程资料</summary>${readings(s.reads)}</details><details class="notes"><summary>记录证据、复盘与理解</summary><textarea aria-label="阶段 ${s.n} 笔记" data-note="${s.n}" placeholder="记录仓库、报告位置、版本和未解决问题…">${esc(saved.notes[s.n]||'')}</textarea></details></div></article>`).join('')}<div class="panel searchable" id="metrics"><h2>统一验收：快、对、稳、可维护</h2><div class="table-wrap"><table><thead><tr><th>维度</th><th>测什么</th><th>何时允许生产启用</th></tr></thead><tbody><tr><td>正确性与质量</td><td>算子/层/模型差分，任务与业务质量</td><td>通过预先制定的误差契约；量化质量下降不超过 G0 约定预算。</td></tr><tr><td>性能</td><td>TTFT、TPOT、E2E 的尾延迟；SLO 内请求 goodput、合格输出 Token/s</td><td>至少重复 3 次作为起点，报告波动/置信区间；提升超过噪声，且在目标负载复现。</td></tr><tr><td>成本</td><td>每百万合格输出 Token 成本</td><td>同硬件/资源范围比较；总成本含卡时、电力、运维和额外部署资源。若输出率 q 以 Token/s 计，小时成本 C 对应 C×10⁶/(3600q)。</td></tr><tr><td>稳定性</td><td>失败率、OOM、长短混合与 soak</td><td>建议以 24 小时稳态压测为起点，按业务周期调整；超时、取消、错误请求纳入统计。</td></tr><tr><td>可维护性</td><td>版本回归、回滚、交接</td><td>由非作者复现；插件/补丁有兼容版本表和回退机制。</td></tr></tbody></table></div><p class="fine">这里的测试次数与 soak 时间是建议起点，不是已验证的行业统一门槛。绝对 SLO、质量预算与性能提升目标由 G0 用业务数据确定。</p></div>`;
const reviewRows=[['保留','第4部分 · L1/L3/L4','执行路径、开源增量、真实瓶颈验收','这些能力能直接支撑定位与优化；继续保留客观产出和交叉验证。'],['调整','第4部分 · L2 枢纽','把写 kernel 当作唯一枢纽','改为“测量—正确性—集成”的共同底座；调度、配置与通信改进不依赖先自写 kernel。'],['调整','第4部分 · L3 判据','必须跑通原生不支持组合','范围过窄且可能鼓励寻找过时问题；可用当前 bug 修复、适配或性能增量证明实现能力。'],['调整','5.2 · M0','230B NVFP4 全模型手写对拍','小模型完整实现 + 目标子图抽样 + 端到端回归。230B 展开 BF16 权重约 460 GB（不含 KV、激活与临时缓冲），作为早期单体参考负担过大。'],['调整','5.2 · 数值判据','logits 容差或 top-k 一致二选一','固定输入、mask、位置与同量化契约；分算子设置 atol/rtol，并补多步与任务质量。top-k 一致可能掩盖数值错误。'],['调整','5.3 → 5.4','先自研 GEMM/Attention，再进引擎','RMSNorm/RoPE 后即集成。NVFP4 GEMM 与 decode attention 为按需专题，优先测已有后端。'],['调整','5.3 · M1','不低于 PyTorch 就通关','教学验收与生产启用分开。生产基准包含引擎优化实现，kernel 微基准不能代替端到端收益。'],['调整','5.5 → 5.6','第7月做系统，第10月做固化','profiling、调度观察、基准与 SOP 从第1周开始；深度系统改动在后期，文档与回归每阶段交付。'],['调整','5.5 · PD 分离','作为固定待办','改为条件分支；PCIe 工作站上的 KV 传输与额外资源可能抵消收益。先验证干扰、网络和成本。'],['保留','第4部分 · L5','最小引擎仅作为能力体检','设为限时选修，不成为生产主线终点，不以替代 vLLM 验收。'],['调整','5.4 / 5.6 · 准出','一个 PR / 两周出结论 / 无厂商支持','PR 提交是协作产出，录用非可控门槛；两周界定为资源到位后的评估窗口，允许 supported/unsupported/blocked。'],['保留','5.8 · 人员','A 算子 / B 集成 / C 验证','职责合理；每项关键资产双人覆盖，按问题协作。兼职或2人团队缩减专题，不压缩验证。']];
$('#review').innerHTML=`<div class="searchable"><div class="eyebrow">DESIGN REVIEW / 第四、第五部分</div><h1>蓝图合理，串行路线需要调整</h1><p class="lead">评估重点是团队能否持续交付可信增量。12 个月可作为能力建设窗口，首个生产问题应在前几个月进入闭环。</p><div class="intro"><div><strong>建议：保留战略，重构关键路径。</strong><p>第四部分由“单向能力阶梯”改为能力矩阵；第五部分由“先学完再集成”改为短闭环与按瓶颈分支。</p></div></div></div><div class="panel searchable"><h2>第四部分：从阶梯改为能力矩阵</h2><p class="fine">原 L1–L5 可保留作学习标签，但不宜作为不可跳跃的生产依赖。全员共享测量、数值与回归能力，再分专业深度。</p><div class="blueprint"><div><b>共同底座 · 测量与数值</b><p>trace、负载、分层对拍、任务质量、回归与复现；从第一周贯穿所有工作。</p></div><div><b>执行路径 · 原 L1</b><p>请求 → 调度 → KV → 模型执行 → logits；从真实 trace 和小模型两端对照。</p></div><div><b>Kernel · 原 L2</b><p>一个 Triton 算子闭环；之后只深挖有热点证据的融合、GEMM 或 Attention。</p></div><div><b>集成与适配 · 原 L3</b><p>后端契约、能力矩阵、dispatch、graph 与 fallback；6–10 周首次接入。</p></div><div><b>服务与并行 · 原 L4</b><p>队列、KV、SLO、TP/EP 通信；从基线开始观察，按真实瓶颈深入。</p></div><div><b>系统贯通 · 原 L5</b><p>限时最小引擎体检 + 新对象迁移演练；教学和生产资产分别验收。</p></div></div></div><div class="panel searchable"><h2>逐项评估与调整依据</h2><div class="table-wrap"><table><thead><tr><th>判断</th><th>原文位置</th><th>原设计</th><th>建议与原因</th></tr></thead><tbody>${reviewRows.map(r=>`<tr><td><span class="verdict ${r[0]==='保留'?'keep':''}">${r[0]}</span></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div></div><h2 class="section-title">会改变路线选择的事实核查</h2><div class="review-grid"><div class="panel searchable"><h3>01 / 历史问题不能当作未来里程碑</h3><p>#33416 已关闭；对应 #33417 在 2026-01-31 合入。把它改成版本升级与回归案例，再复测当前生产问题。修复合入不等于你们锁定版本及全部 NVFP4 后端已可用。</p><span class="source-line">证据：${link(R('issue'))}</span></div><div class="panel searchable"><h3>02 / 区分 SM 与线程块资源</h3><p>原文 SM120 “99 KB/SM”混淆层级。NVIDIA 文档给出的计算能力 12.0 共享内存容量为 128 KB/SM，单线程块上限为 99 KB。tile 设计仍需结合 kernel 与占用率实测。</p><span class="source-line">证据：${link(R('blackwell'))}</span></div><div class="panel searchable"><h3>03 / 注册扩展不是无限制替换</h3><p>vLLM 有 CustomOp/OOT 与插件机制，但集成仍取决于版本、算子契约、设备分发、编译与 graph 路径。把“能注册”变为“验证实际调用与端到端回归”。</p><span class="source-line">证据：${link(R('custom'))} · ${link(R('plugin'))}</span></div><div class="panel searchable"><h3>04 / 兼容性需逐个后端证明</h3><p>设备检查放开与底层 kernel 支持是两件事。不能从原生 FP4/FP8 能力推出 tcgen05/TMEM、packing 或全部 Attention 实现可用。文档中的绝对兼容判断应改写为按版本核验。</p><span class="source-line">核验入口：${link(R('blackwell'))} · ${link(R('cutlass'))}</span></div></div><div class="panel searchable" style="margin-top:22px"><h2>第五部分：人员与投入如何落地</h2><div class="table-wrap"><table><thead><tr><th>角色</th><th>主责</th><th>共同责任与交接</th></tr></thead><tbody><tr><td>A · 算子</td><td>数值、Triton、热点与量化 kernel</td><td>B 参与接口设计，C 独立校验；避免为了自研而优化非热点。</td></tr><tr><td>B · 引擎</td><td>集成、执行路径、KV、调度与并行</td><td>G0 就开始 trace 与配置实验；每项改动包含回退路径。</td></tr><tr><td>C · 验证</td><td>负载、基准、质量回归、版本与工具链</td><td>验证不是末端 QA；与 A/B 共同定义误差和 SLO，并安排非作者复现。</td></tr></tbody></table></div><p>建议 3 人优先深耕 vLLM，一个对照引擎仅用于必要实验。每两周复盘瓶颈证据，每阶段审查生产价值；若问题已被上游解决，升级复测后更换课题。</p><div class="notice">两人或兼职版本：保留基准、分层正确性和一个集成课题；推迟自研 NVFP4 GEMM、decode attention、PD 分离与全新硬件生态。12 个月不是固定交付保证。</div><p class="fine">评估依据：原文第 8–12 页及链接的一手资料。以上时间、角色协作与验收建议属于本次评估推导；尚未运行你们的硬件或生产负载，不宣称已有性能收益。原文前三部分的产业与财务论证不在本次核验范围。</p></div>`;
$('#projects').innerHTML=`<div class="searchable"><div class="eyebrow">PROJECT LADDER / 交付即证据</div><h1>每一档，留下可复现作品</h1><p class="lead">完成阅读后，用项目证明理解。每个项目都包含明确输入、实现范围、验收与参考仓库。</p></div>${projects.map(p=>`<article class="project searchable" id="${p.id}"><div class="project-header"><span class="code">${p.id}</span><div><h2>${p.title}</h2><span class="fine">${p.stage}</span></div></div><p>${p.goal}</p><ul>${p.steps.map(t=>`<li>${t}</li>`).join('')}</ul><div class="gate"><h3>验收</h3>${p.accept}</div>${readings(p.refs)}</article>`).join('')}`;
$('#resources').innerHTML=renderResourceRoom();
function updateProgress(){let total=0;stages.forEach(s=>{let done=s.tasks.filter((_,i)=>saved.tasks[`${s.n}-${i}`]).length;total+=done;$(`#count-${s.n}`).textContent=`${done}/${s.tasks.length}`;let counter=$(`#sidecount-${s.n}`);if(counter)counter.textContent=`${done}/${s.tasks.length}`});$('#global-count').textContent=`${total}/30`;$('#global-progress').value=total;$('#global-progress').setAttribute('aria-label',`已完成 ${total} 项，共 30 项`)}
function sidebar(){let items=current==='roadmap'?[['start-guide','先修与前12周安排','教材、练习与周计划'],...stages.map(s=>[`s${s.n}`,`S${s.n} · ${s.title}`,`${s.time} <span id="sidecount-${s.n}"></span>`])]:current==='review'?[['review','评估总览','方向保留，路线调整'],['metrics','验收标准','查看能力路线底部']]:current==='projects'?projects.map(p=>[p.id,`${p.id} · ${p.title}`,p.stage]):resources.map(r=>[`r-${r.id}`,r.name,r.stage]);$('#sidebar').innerHTML=`<div class="side-label">${({roadmap:'能力建设路线',review:'蓝图与路线评估',projects:'可复现项目',resources:'精选资料'})[current]}</div>${items.map((x,i)=>`<a class="side-link" href="#${x[0]}" data-target="${x[0]}"><span class="side-index">${current==='roadmap'?(i===0?'起步':String(i-1).padStart(2,'0')):String(i+1).padStart(2,'0')}</span><span>${x[1]}<small>${x[2]}</small></span></a>`).join('')}<div class="sidebar-foot">规划版本 v4 · 步骤任务<br>3 人 / 12 个月<br>测量 · 正确性 · 集成<br>先复用，再做必要增量</div>`;updateProgress()}
function applySearch(){let q=$('#search').value.trim().toLowerCase(),hits=0;document.querySelectorAll(`#${current} .searchable`).forEach(el=>{let match=!q||el.textContent.toLowerCase().includes(q);el.hidden=!match;if(match)hits++});$('#empty').hidden=hits>0}
function switchView(v,scroll=true){current=v;document.querySelectorAll('.view').forEach(el=>el.hidden=el.id!==v);document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===v)));sidebar();applySearch();if(scroll)window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('change',e=>{if(e.target.dataset.task){saved.tasks[e.target.dataset.task]=e.target.checked;save();updateProgress()}});document.addEventListener('input',e=>{if(e.target.dataset.note){saved.notes[e.target.dataset.note]=e.target.value;save()}});$('#search').addEventListener('input',applySearch);$('#tabs').addEventListener('click',e=>{if(e.target.dataset.view){$('#search').value='';switchView(e.target.dataset.view);history.replaceState(null,'',`#${current}`)}});$('#sidebar').addEventListener('click',e=>{let a=e.target.closest('a');if(!a)return;if(a.dataset.target==='metrics'){switchView('roadmap',false)}document.querySelectorAll('.side-link').forEach(el=>el.classList.toggle('active',el===a));$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')});$('#menu').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String($('#sidebar').classList.contains('open')))});$('#theme').addEventListener('click',()=>{document.body.classList.toggle('dark');saved.dark=document.body.classList.contains('dark');save()});if(saved.dark)document.body.classList.add('dark');let initial=location.hash.slice(1);switchView(['review','projects','resources'].includes(initial)?initial:'roadmap',false);if(/^s[0-5]$/.test(initial))requestAnimationFrame(()=>$(`#${initial}`).scrollIntoView());
const modelContext=document.modelContext;
if(modelContext?.registerTool){const lifecycle=new AbortController();const tools=[{name:'read_learning_progress',description:'读取本浏览器学习任务完成度，不读取笔记。学习勾选不等于正式准出。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){return {stages:stages.map(s=>({stage:s.n,title:s.title,tasks:s.tasks.map((title,i)=>({id:`${s.n}-${i}`,title,completed:!!saved.tasks[`${s.n}-${i}`]}))}))}}},{name:'set_learning_tasks',description:'批量设置当前浏览器的学习勾选，更新可见清单和进度。不改变正式验收状态，不向外部传输数据。',inputSchema:{type:'object',properties:{tasks:{type:'array',minItems:1,maxItems:30,items:{type:'object',properties:{id:{type:'string',pattern:'^[0-5]-[0-4]$'},completed:{type:'boolean'}},required:['id','completed'],additionalProperties:false}}},required:['tasks'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||Object.keys(input).some(k=>k!=='tasks')||!Array.isArray(input.tasks)||input.tasks.length<1||input.tasks.length>30||input.tasks.some(t=>!t||Object.keys(t).some(k=>!['id','completed'].includes(k))||typeof t.id!=='string'||!/^[0-5]-[0-4]$/.test(t.id)||typeof t.completed!=='boolean'))throw new Error('Invalid task input');input.tasks.forEach(t=>{saved.tasks[t.id]=t.completed;document.querySelector(`input[data-task="${t.id}"]`).checked=t.completed});save();switchView('roadmap',false);updateProgress();return {updated:input.tasks,totalCompleted:Object.values(saved.tasks).filter(Boolean).length}}}];for(const tool of tools){try{Promise.resolve(modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
</script></body></html>
